spring.application.name=catconnect-backend
server.port=8080
server.address=0.0.0.0

# mysql = shared online MySQL (default). Use -Dspring.profiles.active=dev for local H2 only.
spring.profiles.active=local
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=CatConnectSecretKeyChangeThisInProduction2026!
app.jwt.expiration-ms=86400000

app.storage.path=../storage/images
app.cors.allowed-origins=*

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
