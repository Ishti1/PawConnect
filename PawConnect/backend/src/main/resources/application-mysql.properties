# Online / remote MySQL (PlanetScale, Railway, AWS RDS, Aiven, etc.)
# Set env vars, or copy application-local.properties.example → application-local.properties

spring.datasource.url=${CATCONNECT_DB_URL:jdbc:mysql://localhost:3306/catconnect?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CATCONNECT_DB_USER:root}
spring.datasource.password=${CATCONNECT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
